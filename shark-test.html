<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background: #0A0D14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      gap: 20px;
      font-family: sans-serif;
      color: white;
    }
    .preview-box {
      display: flex;
      gap: 30px;
      align-items: center;
      background: #10141E;
      padding: 40px;
      border-radius: 20px;
      border: 1px solid #1E293B;
    }
  </style>
</head>
<body>
  <h1>MrBeast Style Shark Logo Preview</h1>
  <div class="preview-box">
    <!-- Big size -->
    <div style="width: 140px; height: 140px;">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
        <defs>
          <linearGradient id="beastCyan" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00F5FF" />
            <stop offset="50%" stop-color="#00B4D8" />
            <stop offset="100%" stop-color="#0077B6" />
          </linearGradient>
          <linearGradient id="beastPink" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF1088" />
            <stop offset="50%" stop-color="#FF007A" />
            <stop offset="100%" stop-color="#D9048E" />
          </linearGradient>
          <linearGradient id="beastDarkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#03254C" />
            <stop offset="100%" stop-color="#011627" />
          </linearGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00F5FF" flood-opacity="0.8" />
            <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF007A" flood-opacity="0.6" />
          </filter>
        </defs>

        <!-- Shark Body Base (Navy Shadow) -->
        <path d="M 10 75 C 16 55 26 38 40 22 C 46 14 52 5 54 6 C 55 7 51 18 49 26 C 60 24 74 27 87 37 C 94 42 98 47 96 50 C 93 52 83 53 76 55 C 68 57 63 62 57 66 L 51 57 C 41 59 29 65 19 75 Z" fill="url(#beastDarkBlue)" />
        
        <!-- Main Shark Body (Cyan) -->
        <path d="M 12 73 C 18 57 28 40 42 24 C 47 16 53 7 54 8 C 55 9 52 20 50 28 C 61 26 75 29 88 39 C 95 44 99 48 97 51 C 94 52 84 53 77 55 C 69 57 64 62 58 66 L 52 57 C 42 59 30 65 20 74 Z" fill="url(#beastCyan)" />

        <!-- Lower Jaw -->
        <path d="M 40 78 C 50 76 60 74 70 70 C 74 68 77 66 76 64 C 74 63 68 64 62 66 C 55 68 47 71 40 73 Z" fill="url(#beastCyan)" />

        <!-- Dark Mouth Cavity -->
        <path d="M 54 57 C 62 56 70 54 77 53 C 75 55 71 58 67 61 C 62 64 58 65 54 65 C 50 65 47 62 48 60 Z" fill="#1A0022" />

        <!-- Sharp Teeth -->
        <polygon points="56,56 58,59 60,56" fill="#FFF" />
        <polygon points="61,55 63,59 65,55" fill="#FFF" />
        <polygon points="66,54 68,58 70,54" fill="#FFF" />
        <polygon points="71,53 73,57 75,53" fill="#FFF" />
        <polygon points="57,63 59,60 61,63" fill="#FFF" />
        <polygon points="62,62 64,59 66,62" fill="#FFF" />
        <polygon points="67,61 69,58 71,61" fill="#FFF" />

        <!-- MrBeast Lightning Bolt in Hot Pink -->
        <polygon points="64,18 72,32 66,32 74,44 60,36 65,36 58,22" fill="url(#beastPink)" filter="url(#glow)" />
        <polygon points="65,20 71,32 66,32 73,43 62,36 66,36 60,23" fill="#FF80BF" />

        <!-- Fierce Eye -->
        <polygon points="78,39 84,42 80,44 76,41" fill="#FFF" />
        <polygon points="79,40 82,42 80,43 77,41" fill="#FF007A" />

        <!-- Gills -->
        <path d="M 38 46 Q 40 50 39 54" stroke="#00F5FF" stroke-width="1.5" stroke-linecap="round" />
        <path d="M 42 45 Q 44 49 43 53" stroke="#00F5FF" stroke-width="1.5" stroke-linecap="round" />
        <path d="M 46 44 Q 48 48 47 52" stroke="#00F5FF" stroke-width="1.5" stroke-linecap="round" />
      </svg>
    </div>

    <!-- Small size (like sidebar) -->
    <div style="width: 36px; height: 36px; background: #0B0E17; border-radius: 10px; display: flex; align-items: center; justify-content: center; border: 1px solid #3B82F6;">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 28px; height: 28px;">
        <defs>
          <linearGradient id="beastCyan2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00F5FF" />
            <stop offset="100%" stop-color="#0077B6" />
          </linearGradient>
          <linearGradient id="beastPink2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF1088" />
            <stop offset="100%" stop-color="#FF007A" />
          </linearGradient>
        </defs>
        <path d="M 12 73 C 18 57 28 40 42 24 C 47 16 53 7 54 8 C 55 9 52 20 50 28 C 61 26 75 29 88 39 C 95 44 99 48 97 51 C 94 52 84 53 77 55 C 69 57 64 62 58 66 L 52 57 C 42 59 30 65 20 74 Z" fill="url(#beastCyan2)" />
        <path d="M 40 78 C 50 74 60 72 70 68 C 73 66 76 64 75 63 C 73 63 67 64 61 66 C 54 68 47 71 40 73 Z" fill="url(#beastCyan2)" />
        <path d="M 54 57 C 62 56 70 54 77 53 C 75 55 71 58 67 61 C 62 64 58 65 54 65 C 50 65 47 62 48 60 Z" fill="#1A0022" />
        <polygon points="56,56 58,59 60,56" fill="#FFF" />
        <polygon points="61,55 63,59 65,55" fill="#FFF" />
        <polygon points="66,54 68,58 70,54" fill="#FFF" />
        <polygon points="71,53 73,57 75,53" fill="#FFF" />
        <polygon points="57,63 59,60 61,63" fill="#FFF" />
        <polygon points="62,62 64,59 66,62" fill="#FFF" />
        <polygon points="67,61 69,58 71,61" fill="#FFF" />
        <polygon points="64,18 72,32 66,32 74,44 60,36 65,36 58,22" fill="url(#beastPink2)" />
        <polygon points="78,39 84,42 80,44 76,41" fill="#FFF" />
        <polygon points="79,40 82,42 80,43 77,41" fill="#FF007A" />
      </svg>
    </div>

    <!-- Branding preview -->
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 24px; font-weight: 900; letter-spacing: 1px;">NEXORA</span>
      <span style="font-size: 11px; font-weight: 700; color: #00F5FF; border: 1px solid #00F5FF; padding: 2px 6px; border-radius: 6px;">SHARK EDITION</span>
    </div>
  </div>
</body>
</html>
